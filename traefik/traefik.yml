api:
  insecure: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    defaultRule: "Host(`{{ trimPrefix `/` .Name }}.docker.localhost`)"

routers:
  dashboard:
    rule: "HostRegexp(`{host:.+}`)"  # matches any host
    entryPoints:
      - web
    service: "api@internal"

networks:
  infra:
    name: infra
