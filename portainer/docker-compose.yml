networks:
  infra:
    driver: bridge
    external: true
    name: infra
    ipam:
      config:
        - subnet: 172.18.0.0/16

services:
  portainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portainer
    hostname: portainer
    image: infra/portainer:1.0
    restart: unless-stopped
    tty: true
    networks:
      infra:
        ipv4_address: 172.18.0.54
    volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - portainer:/data

volumes:
    portainer:
        driver: local
        name: portainer
