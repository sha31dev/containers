jenkins:
    securityRealm:
        local:
            allowsSignup: false
            users:
                - id: ${JENKINS_ADMIN_ID}
                  password: ${JENKINS_ADMIN_PASSWORD}
    authorizationStrategy:
        globalMatrix:
            permissions:
                - "Overall/Administer:authenticated"
    remotingSecurity:
        enabled: true
    crumbIssuer: "standard"

security:
    queueItemAuthenticator:
        authenticators:
            - global:
                  strategy: triggeringUsersAuthorizationStrategy

unclassified:
    location:
        url: ${JENKINS_URL}
